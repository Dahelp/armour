name: Deploy production over FTPS

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/**'
      - 'resources/**'
      - 'tests/**'
      - 'public/**'
      - '!public/uploads/**'
      - 'vendor/ishop/core/**'
      - '.htaccess'
      - 'robots.txt'
      - 'composer.json'
      - 'composer.lock'
      - 'ops/production/deploy_ftps.py'
      - 'ops/production/grass-ftps.pem'
      - '.github/workflows/deploy-production-ftps.yml'
  workflow_dispatch:

concurrency:
  group: techtires-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql
          coverage: none
      - name: Install production dependencies and validate source
        run: |
          set -euo pipefail
          composer install --no-dev --prefer-dist --no-interaction --classmap-authoritative
          python3 tests/DeployFtpsTest.py
          git ls-files -z '*.php' ':!:public/adminlte/**' | xargs -0 -r -n1 php -l > /tmp/php-lint.log
          for test in tests/*Test.php; do php -d error_reporting=E_ALL -d display_errors=1 "$test"; done
      - name: Find last successful production revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-production-ftps.yml/runs" -f status=success -f branch=main -f per_page=1 --jq '.workflow_runs[0].head_sha // empty')"
          # Last confirmed production revision before adopting this workflow.
          base="${base:-15108763ad85ba3ce0e06b8390e782c83d534730}"
          git merge-base --is-ancestor "$base" HEAD
          echo "DEPLOY_BASE=$base" >> "$GITHUB_ENV"
          python3 ops/production/deploy_ftps.py --base "$base" --plan
      - name: Publish source changes using encrypted pinned FTPS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 ops/production/deploy_ftps.py --base "$DEPLOY_BASE"
      - name: Verify public storefront
        run: |
          set -euo pipefail
          for path in / /catalog-front /shiny-23-5-25-20pr-superguider-klyushka; do
            ok=0
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --max-time 40 "https://techtires.ru$path" -o /tmp/navigation.html &&
                grep -q 'class="size-navigation"' /tmp/navigation.html &&
                grep -q 'href="/tiposize-23.5-25"' /tmp/navigation.html &&
                ! grep -Eqi 'Fatal error|Uncaught (Error|Exception)' /tmp/navigation.html; then
                ok=1
                break
              fi
              sleep 10
            done
            test "$ok" = 1
            printf 'Verified production page: %s\n' "$path"
          done
          curl --fail --silent --show-error --max-time 40 https://techtires.ru/tiposize-23.5-25 -o /tmp/size.html
          grep -q 'product-card-unified__title' /tmp/size.html
      - name: Record successful production revision
        run: |
          printf 'Production commit: `%s`\n\nTransport: TLS 1.2+ FTPS with certificate and public key verification.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
