name: Deploy tire size navigation
on:
  workflow_dispatch:
concurrency:
  group: techtires-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Prepare four navigation files
        run: |
          set -euo pipefail
          for file in app/views/armour/size-links.php app/views/armour/Main/index.php app/views/armour/Category/view.php app/views/armour/Product/view.php; do
            php -l "$file"
            mkdir -p ".release/$(dirname "$file")"
            cp "$file" ".release/$file"
          done
      - name: Upload four navigation files over pinned FTPS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          for file in app/views/armour/size-links.php app/views/armour/Main/index.php app/views/armour/Category/view.php app/views/armour/Product/view.php; do
            curl --fail --silent --show-error --ssl-reqd --tlsv1.2 \
              --cacert ops/production/grass-ftps.pem \
              --pinnedpubkey 'sha256//7LxfqpWQuC6EJX5sB1h2e3SOWKCEg1a7V1xfDIZ6ySY=' \
              --ciphers 'DEFAULT:@SECLEVEL=1' \
              --connect-timeout 20 --max-time 120 --retry 2 \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$file" "ftp://grass.gohost.ru:21/$file"
          done
      - name: Verify public navigation after PHP cache revalidation
        run: |
          set -euo pipefail
          for path in / /catalog-front /shiny-23-5-25-20pr-superguider-klyushka; do
            ok=0
            for attempt in $(seq 1 12); do
              curl --fail-with-body --silent --show-error --max-time 40 "https://techtires.ru$path" -o /tmp/navigation.html
              if grep -q 'class="size-navigation"' /tmp/navigation.html && grep -q 'href="/tiposize-23.5-25"' /tmp/navigation.html; then
                ok=1
                break
              fi
              sleep 10
            done
            test "$ok" = 1
            printf 'Verified size navigation: %s\n' "$path"
          done
          curl --fail-with-body --silent --show-error --max-time 40 https://techtires.ru/tiposize-23.5-25 -o /tmp/size.html
          grep -q 'product-card-unified__title' /tmp/size.html
