name: Publish P332 product photo
on:
  workflow_dispatch:
concurrency:
  group: techtires-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Publish photo and update P332 products over pinned FTPS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 ops/production/update_p332_photo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p332-photo-result
          path: p332-result.json
