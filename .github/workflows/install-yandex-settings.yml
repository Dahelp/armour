name: Install Yandex settings

on:
  workflow_dispatch:

concurrency:
  group: techtires-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build protected runner
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          file="__yandex_settings_$(openssl rand -hex 16).php"
          echo "RUNNER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "RUNNER_FILE=$file" >> "$GITHUB_ENV"
          mkdir -p .runner
          cat > ".runner/$file" <<PHP
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          if (!hash_equals('$token', (string)(\$_SERVER['HTTP_X_RUNNER_TOKEN'] ?? ''))) { http_response_code(403); exit; }
          try {
              require dirname(__DIR__) . '/config/init.php';
              \$config = require CONF . '/config_db.php';
              \$pdo = new PDO(\$config['dsn'], \$config['user'], \$config['pass'], [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
              \$pdo->exec(file_get_contents(dirname(__DIR__) . '/database/migrations/20261022_006_yandex_settings.sql'));
              echo json_encode(\$pdo->query("SELECT alt_name, znachenie FROM options WHERE alt_name IN ('option_yandex_metrika', 'option_yandex_verification')")->fetchAll(PDO::FETCH_KEY_PAIR));
          } catch (Throwable \$exception) {
              http_response_code(500);
              echo json_encode(['error' => \$exception->getMessage()]);
          }
          PHP
          php -l ".runner/$file"
      - name: Upload runner
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-allow false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          put "database/migrations/20261022_006_yandex_settings.sql" -o "/database/migrations/20261022_006_yandex_settings.sql"
          put ".runner/$RUNNER_FILE" -o "/public/$RUNNER_FILE"
          bye
          LFTP
      - name: Install settings
        run: curl --fail-with-body --silent --show-error --max-time 60 -X POST -H "X-Runner-Token:$RUNNER_TOKEN" "https://techtires.ru/$RUNNER_FILE"
      - name: Remove runner
        if: always()
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-allow false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          rm -f "/public/$RUNNER_FILE"
          bye
          LFTP
