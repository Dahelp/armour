name: Cleanup EKKA cross duplicates
on: { workflow_dispatch: {} }
concurrency: { group: techtires-production, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build protected cleanup runner
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$FTP_PASSWORD:$GITHUB_RUN_ID" | sha256sum | cut -c1-40)"
          runner="__cross_cleanup_$(printf '%s' "$token:runner" | sha256sum | cut -c1-20).php"
          data="__cross_cleanup_$(printf '%s' "$token:data" | sha256sum | cut -c1-20).json"
          echo "CROSS_CLEANUP_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CROSS_CLEANUP_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "CROSS_CLEANUP_DATA=$data" >> "$GITHUB_ENV"
          mkdir -p .cross-cleanup/public .cross-cleanup/app/services .cross-cleanup/tmp
          cp app/services/CrossCleanupService.php .cross-cleanup/app/services/
          cp resources/migrations/ekka-cross-duplicates-2026-09-04.json ".cross-cleanup/tmp/$data"
          cat > .cross-cleanup/public/runner.php <<'PHP'
          <?php
          declare(strict_types=1);header('Content-Type: application/json; charset=utf-8');header('Cache-Control: no-store');
          if(($_GET['token']??'')!=='__TOKEN__'){http_response_code(404);exit;}
          try{require dirname(__DIR__).'/config/init.php';require_once dirname(__DIR__).'/app/services/CrossCleanupService.php';\ishop\Db::instance();$payload=json_decode((string)file_get_contents(dirname(__DIR__).'/tmp/__DATA__'),true,512,JSON_THROW_ON_ERROR);$result=(new \app\services\CrossCleanupService())->removeEkkaCrosses($payload['cross_ids']??[]);echo json_encode(['ok'=>true]+$result,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);}catch(Throwable $e){http_response_code(500);echo json_encode(['ok'=>false,'error'=>$e->getMessage()],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);}
          PHP
          sed -i "s/__TOKEN__/$token/;s/__DATA__/$data/" .cross-cleanup/public/runner.php
          mv .cross-cleanup/public/runner.php ".cross-cleanup/public/$runner"
      - name: Backup and delete marked crosses
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "set ftp:ssl-allow false; mirror --reverse --transfer-all --no-perms .cross-cleanup/ /; bye" -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          status="$(curl --silent --show-error --max-time 180 "https://techtires.ru/$CROSS_CLEANUP_RUNNER?token=$CROSS_CLEANUP_TOKEN" -o .cross-cleanup-result.json -w '%{http_code}')"
          result="$(cat .cross-cleanup-result.json)"
          printf '%s\n' "$result"
          if [ "$status" != 200 ]; then printf 'TechTires runner HTTP %s\n' "$status"; exit 1; fi
          php -r '$r=json_decode($argv[1],true,512,JSON_THROW_ON_ERROR);if(($r["ok"]??false)!==true||($r["deleted"]??-1)!==($r["matched"]??-2))exit(1);' "$result"
      - name: Remove transfer files
        if: always()
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: lftp -e "set cmd:fail-exit false; set ftp:ssl-allow false; rm -f /public/$CROSS_CLEANUP_RUNNER; rm -f /tmp/$CROSS_CLEANUP_DATA; bye" -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
