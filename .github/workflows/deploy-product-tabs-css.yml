name: Deploy product tabs CSS
on:
  workflow_dispatch:
concurrency:
  group: techtires-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Upload product tabs stylesheet
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-allow false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          put public/css/armour/product-tabs.css -o /public/css/armour/product-tabs.css
          bye
          LFTP
      - name: Verify public stylesheet
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 "https://techtires.ru/css/armour/product-tabs.css?v=$GITHUB_RUN_ID" -o deployed.css
          cmp public/css/armour/product-tabs.css deployed.css
