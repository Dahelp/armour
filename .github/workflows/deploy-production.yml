name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: techtires-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --classmap-authoritative

      - name: Run compatibility checks
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*Test.php; do php -d error_reporting=E_ALL -d display_errors=1 "$test"; done

      - name: Assemble release
        shell: bash
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_PROTOCOL: ${{ secrets.SMTP_PROTOCOL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DB_HOST"
          test -n "$DB_DATABASE"
          test -n "$DB_USERNAME"
          test -n "$DB_PASSWORD"
          mkdir -p .release
          rsync -a ./ .release/ \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/.agents/' \
            --exclude '/.release/' \
            --exclude '/.env' \
            --exclude '/tests/' \
            --exclude '/tmp/' \
            --exclude '/public/uploads/'
          {
            printf 'APP_ENV=production\n'
            printf 'APP_DEBUG=0\n'
            printf 'APP_URL=https://techtires.ru\n\n'
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=3306\n'
            printf 'DB_DATABASE=%s\n' "$DB_DATABASE"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n\n' "$DB_PASSWORD"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
            printf 'SMTP_PROTOCOL=%s\n' "${SMTP_PROTOCOL:-tls}"
            printf 'SMTP_USERNAME=%s\n' "$SMTP_USERNAME"
            printf 'SMTP_PASSWORD=%s\n\n' "$SMTP_PASSWORD"
            printf 'CRON_TOKEN=%s\n\n' "$CRON_TOKEN"
            printf 'LEGACY_REDIRECTS_ENABLED=0\n'
            printf 'LEGACY_REDIRECT_BASE_URL=https://techtires.ru\n'
          } > .release/.env

      - name: Upload release by FTP
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-allow false
          set net:max-retries 3
          set net:timeout 30
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          mirror --reverse --continue --parallel=8 --only-newer --no-perms --verbose ./.release/ /www/techtires.ru/
          bye
          LFTP
