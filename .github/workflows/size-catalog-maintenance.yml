name: Catalog size maintenance
on:
  workflow_dispatch:
concurrency:
  group: techtires-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Audit catalog size bindings
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 ops/production/size_catalog_maintenance.py
      - uses: actions/upload-artifact@v4
        with:
          name: size-catalog-report
          path: size-catalog-report.json
          retention-days: 3
