name: Catalog size maintenance
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply reviewed tire size bindings
      audit_run_id:
        type: string
        default: ''
        description: Run containing the encrypted reviewed audit
concurrency:
  group: techtires-production
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Read authorized diagnostic artifact
        if: inputs.apply
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
        run: |
          [[ "$AUDIT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run download "$AUDIT_RUN_ID" -n size-catalog-report -D .runner/audit
      - name: Audit catalog size bindings
        env:
          APPLY: ${{ inputs.apply }}
          AUDIT_REPORT: .runner/audit/size-catalog-report.enc
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 ops/production/size_catalog_maintenance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: size-catalog-report
          path: |
            size-catalog-report.enc
            size-catalog-summary.json
          retention-days: 3
