name: Deploy grouped filter XML fix
on:
  workflow_dispatch:
concurrency:
  group: techtires-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql
          coverage: none
      - name: Build and verify autoloader
        run: |
          composer install --no-dev --prefer-dist --no-interaction --classmap-authoritative
          php tests/ProductAttributeXmlMapperTest.php
          php tests/ImportSecurityTest.php
          php -l app/controllers/admin/ImportController.php
          php -l app/controllers/admin/ExportController.php
      - name: Build protected OPcache runner
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::$token"
          file="__filter_import_$(openssl rand -hex 16).php"
          echo "RUNNER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "RUNNER_FILE=$file" >> "$GITHUB_ENV"
          mkdir -p .runner
          cat > ".runner/$file" <<PHP
          <?php
          header('Cache-Control: no-store');
          if (!hash_equals('$token', (string)(\$_SERVER['HTTP_X_RUNNER_TOKEN'] ?? ''))) { http_response_code(403); exit; }
          echo !function_exists('opcache_reset') || opcache_reset() ? 'ok' : 'failed';
          PHP
      - name: Upload the three changed application files and Composer maps
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-allow false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          put app/services/ProductAttributeXmlMapper.php -o /app/services/ProductAttributeXmlMapper.php
          mirror --reverse --transfer-all --no-perms vendor/composer /vendor/composer
          put vendor/autoload.php -o /vendor/autoload.php
          put app/controllers/admin/ImportController.php -o /app/controllers/admin/ImportController.php
          put app/controllers/admin/ExportController.php -o /app/controllers/admin/ExportController.php
          put ".runner/$RUNNER_FILE" -o "/public/$RUNNER_FILE"
          bye
          LFTP
      - name: Reset OPcache and check a repaired product
        run: |
          result="$(curl --fail-with-body --silent --show-error --max-time 30 -X POST -H "X-Runner-Token:$RUNNER_TOKEN" "https://techtires.ru/$RUNNER_FILE")"
          test "$result" = ok
          curl --fail-with-body --silent --show-error --max-time 30 https://techtires.ru/filter-4 -o product.html
          php -r '$html=file_get_contents("product.html");exit(str_contains($html,"Внутренний")&&str_contains($html,"Внешний")?0:1);'
      - name: Remove runner
        if: always()
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if ! command -v lftp >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq lftp; fi
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-allow false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          rm -f "/public/$RUNNER_FILE"
          bye
          LFTP
