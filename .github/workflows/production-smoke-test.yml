name: Production smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Build one-time sitemap runner
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          file="__sitemap_smoke_$(printf '%s' "$FTP_PASSWORD:$GITHUB_RUN_ID" | sha256sum | cut -c1-24).php"
          echo "SITEMAP_RUNNER_FILE=$file" >> "$GITHUB_ENV"
          mkdir -p .smoke/public
          cat > ".smoke/public/$file" <<'PHP'
          <?php
          declare(strict_types=1);
          header('Content-Type: text/plain; charset=utf-8');
          header('Cache-Control: no-store');
          try {
              require dirname(__DIR__) . '/config/init.php';
              require_once dirname(__DIR__) . '/app/services/SitemapGenerator.php';
              \ishop\Db::instance();
              $count = (new \app\services\SitemapGenerator())->generate();
              echo 'Sitemap generated: ' . $count . " URLs.\n";
          } catch (Throwable $exception) {
              http_response_code(500);
              echo 'Sitemap error: ' . $exception->getMessage() . "\n";
          }
          PHP

      - name: Upload one-time sitemap runner
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-allow false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          put ".smoke/public/$SITEMAP_RUNNER_FILE" -o "/public/$SITEMAP_RUNNER_FILE"
          bye
          LFTP

      - name: Regenerate sitemap from production database
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body --silent --show-error --max-time 180 \
            "https://techtires.ru/$SITEMAP_RUNNER_FILE")"
          printf '%s\n' "$result"
          count="$(printf '%s' "$result" | sed -n 's/.*Sitemap generated: \([0-9][0-9]*\) URLs.*/\1/p')"
          test -n "$count"
          test "$count" -gt 1

      - name: Remove one-time sitemap runner
        if: always()
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set cmd:fail-exit false
          set ftp:passive-mode true
          set ftp:ssl-allow false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          rm "/public/$SITEMAP_RUNNER_FILE"
          bye
          LFTP

      - name: Verify public routes and SEO invariants
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          check_page() {
            name="$1"
            url="$2"
            expected="$3"
            code="$(curl --silent --show-error --max-time 60 -o "$tmp/$name.html" -w '%{http_code}' "$url")"
            printf '%-12s HTTP %s\n' "$name" "$code"
            test "$code" = "$expected"
            ! grep -Eqi 'Fatal error|Uncaught (Error|Exception)|Warning:' "$tmp/$name.html"
          }

          check_page home https://techtires.ru/ 200
          check_page catalog https://techtires.ru/catalog-vil 200
          check_page product https://techtires.ru/200-50-10-celnolitaya-belaya-nm-ist 200
          check_page search 'https://techtires.ru/search/?s=test' 200
          check_page cart https://techtires.ru/cart/view 200
          check_page missing https://techtires.ru/__smoke_missing_page__ 404

          grep -Fq 'name="csrf-token"' "$tmp/catalog.html"
          grep -Fq 'rel="canonical"' "$tmp/catalog.html"
          grep -Fq 'rel="canonical"' "$tmp/product.html"
          grep -Fq 'application/ld+json' "$tmp/product.html"
          grep -Fq 'noindex, nofollow' "$tmp/search.html"

          admin_location="$(curl --silent --show-error --head --max-time 30 https://techtires.ru/admin | tr -d '\r' | sed -n 's/^Location: //p')"
          printf 'admin        %s\n' "$admin_location"
          test "$admin_location" = 'https://techtires.ru/admin/user/login-admin'

          legacy_location="$(curl --silent --show-error --head --max-time 30 \
            https://techtires.ru/shiny-1800-25-belshina-vf-76bm-32pr-e3.html \
            | tr -d '\r' | sed -n 's/^Location: //p')"
          printf 'legacy       %s\n' "$legacy_location"
          test "$legacy_location" = 'https://techtires.ru/shiny-1800-25-belshina-vf-76bm-32pr-e3'

          robots="$(curl --fail --silent --show-error https://techtires.ru/robots.txt)"
          printf 'robots       %q\n' "$robots"
          test "$robots" = $'User-agent: *\nDisallow: /'

          curl --fail --silent --show-error https://techtires.ru/sitemap.xml -o "$tmp/sitemap.xml"
          grep -Fq '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' "$tmp/sitemap.xml"
          sitemap_count="$(grep -c '<url><loc>' "$tmp/sitemap.xml")"
          printf 'sitemap      %s URLs\n' "$sitemap_count"
          test "$sitemap_count" -gt 1

          http_location="$(curl --silent --show-error --head --max-time 30 http://techtires.ru/ | tr -d '\r' | sed -n 's/^Location: //p')"
          printf 'http         %s\n' "$http_location"
          test "$http_location" = 'https://techtires.ru:443/' || test "$http_location" = 'https://techtires.ru/'
