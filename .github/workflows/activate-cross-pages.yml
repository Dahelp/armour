name: Activate cross pages
on: { workflow_dispatch: {} }
concurrency: { group: techtires-production, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build protected activation runner
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$FTP_PASSWORD:$GITHUB_RUN_ID" | sha256sum | cut -c1-40)"
          runner="__cross_activate_$(printf '%s' "$token:runner" | sha256sum | cut -c1-20).php"
          echo "CROSS_ACTIVATE_TOKEN=$token" >> "$GITHUB_ENV"
          echo "CROSS_ACTIVATE_RUNNER=$runner" >> "$GITHUB_ENV"
          mkdir -p .cross-activate/public
          cat > ".cross-activate/public/$runner" <<'PHP'
          <?php
          declare(strict_types=1);header('Content-Type: application/json; charset=utf-8');header('Cache-Control: no-store');
          if(($_GET['token']??'')!=='__TOKEN__'){http_response_code(404);exit;}
          try{require dirname(__DIR__).'/config/init.php';\ishop\Db::instance();$indexAdded=(new \app\services\CrossIndexService())->ensure();$sitemapUrls=(new \app\services\SitemapGenerator())->generate();$visible=(int)\R::getCell("SELECT COUNT(*) FROM plagins_cross c INNER JOIN product p ON p.id=c.product_id WHERE p.hide!='hide'");$sample=(string)\R::getCell("SELECT c.cross_abbreviated_name FROM plagins_cross c INNER JOIN product p ON p.id=c.product_id WHERE p.hide!='hide' AND c.cross_abbreviated_name REGEXP '^[A-Za-z0-9._-]+$' ORDER BY c.id LIMIT 1");$samplePath=\app\services\CrossUrl::canonicalPath($sample);if($visible<1||$samplePath==='')throw new RuntimeException('No public cross sample found.');echo json_encode(['ok'=>true,'index_added'=>$indexAdded,'visible_crosses'=>$visible,'sitemap_urls'=>$sitemapUrls,'sample_path'=>$samplePath],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR);}catch(Throwable $e){http_response_code(500);echo json_encode(['ok'=>false,'error'=>$e->getMessage()],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);}
          PHP
          sed -i "s/__TOKEN__/$token/" ".cross-activate/public/$runner"
      - name: Apply index and regenerate sitemap
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "set ftp:ssl-allow false; mirror --reverse --transfer-all --no-perms .cross-activate/ /; bye" -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          status="$(curl --silent --show-error --max-time 180 "https://techtires.ru/$CROSS_ACTIVATE_RUNNER?token=$CROSS_ACTIVATE_TOKEN" -o .cross-activate-result.json -w '%{http_code}')"
          result="$(cat .cross-activate-result.json)"; printf '%s\n' "$result"
          if [ "$status" != 200 ]; then exit 1; fi
          sample="$(php -r '$r=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);if(($r["ok"]??false)!==true)exit(1);echo $r["sample_path"];' .cross-activate-result.json)"
          page="$(curl --fail --silent --show-error --max-time 60 "https://techtires.ru/$sample")"
          printf '%s' "$page" | grep -Fq "<link rel=\"canonical\" href=\"https://techtires.ru/$sample\""
          legacy="crossing-${sample#cross/}.html"
          headers="$(curl --silent --show-error --max-time 60 --head "https://techtires.ru/$legacy")"
          printf '%s' "$headers" | grep -Eq '^HTTP/[^ ]+ 301'
          printf '%s' "$headers" | tr -d '\r' | grep -Fiq "location: https://techtires.ru/$sample"
          grep -Fq "<loc>https://techtires.ru/$sample</loc>" <(curl --fail --silent --show-error --max-time 60 https://techtires.ru/sitemap.xml)
      - name: Remove activation runner
        if: always()
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: lftp -e "set cmd:fail-exit false; set ftp:ssl-allow false; rm -f /public/$CROSS_ACTIVATE_RUNNER; bye" -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
