name: Deploy production source delta

on:
  workflow_dispatch:

concurrency:
  group: techtires-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble changed application files
        shell: bash
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_PROTOCOL: ${{ secrets.SMTP_PROTOCOL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DB_HOST"
          test -n "$DB_DATABASE"
          test -n "$DB_USERNAME"
          test -n "$DB_PASSWORD"
          mkdir -p .release
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|tests/*|docs/*|public/uploads/*) continue ;;
            esac
            if [ -f "$file" ]; then
              mkdir -p ".release/$(dirname "$file")"
              cp -p "$file" ".release/$file"
            fi
          # a3eb3d4b is the last commit confirmed by a successful production run.
          # Deploy only what changed after that point; re-uploading the whole
          # migration history can stall the FTP server.
          done < <(git diff --name-only -z a3eb3d4b..HEAD)
          mkdir -p .release/public
          cp -p robots.txt .release/robots.txt
          cp -p public/robots.txt .release/public/robots.txt
          {
            printf 'APP_ENV=production\nAPP_DEBUG=0\nAPP_URL=https://techtires.ru\n\n'
            printf 'DB_HOST=%s\nDB_PORT=3306\nDB_DATABASE=%s\nDB_USERNAME=%s\nDB_PASSWORD=%s\n\n' "$DB_HOST" "$DB_DATABASE" "$DB_USERNAME" "$DB_PASSWORD"
            printf 'SMTP_HOST=%s\nSMTP_PORT=%s\nSMTP_PROTOCOL=%s\nSMTP_USERNAME=%s\nSMTP_PASSWORD=%s\n\n' "$SMTP_HOST" "${SMTP_PORT:-587}" "${SMTP_PROTOCOL:-tls}" "$SMTP_USERNAME" "$SMTP_PASSWORD"
            printf 'CRON_TOKEN=%s\n\n' "$CRON_TOKEN"
            printf 'LEGACY_REDIRECTS_ENABLED=1\nLEGACY_REDIRECT_BASE_URL=https://techtires.ru\n'
          } > .release/.env
          find .release -type f | wc -l

      - name: Force upload changed files
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # curl is preinstalled on GitHub runners. Avoid apt/lftp here: package
          # mirror delays were keeping an otherwise tiny FTP deployment running.
          find .release -type f -print0 | while IFS= read -r -d '' file; do
            remote_path="/${file#./.release/}"
            curl --fail --silent --show-error --disable-epsv --ftp-create-dirs \
              --connect-timeout 20 --max-time 120 --retry 2 --retry-all-errors \
              --user "$FTP_USERNAME:$FTP_PASSWORD" --upload-file "$file" \
              "ftp://grass.gohost.ru:21${remote_path}"
          done
