name: Migrate production database

on:
  workflow_dispatch:

concurrency:
  group: techtires-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Build one-time migration runner
        shell: bash
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          runner="__db_migrate_$(printf '%s' "$FTP_PASSWORD:$GITHUB_RUN_ID" | sha256sum | cut -c1-24).php"
          echo "MIGRATION_RUNNER_FILE=$runner" >> "$GITHUB_ENV"
          mkdir -p .migration/public .migration/app/services .migration/tmp/reports/production
          cp app/services/ProductionMigrationService.php .migration/app/services/
          cp tmp/reports/production/legacy-urls-production.csv .migration/tmp/reports/production/
          cat > ".migration/public/$runner" <<'PHP'
          <?php
          declare(strict_types=1);
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          try {
              require dirname(__DIR__) . '/config/init.php';
              require_once dirname(__DIR__) . '/app/services/ProductionMigrationService.php';
              \ishop\Db::instance();
              $result = (new \app\services\ProductionMigrationService())->run(
                  dirname(__DIR__) . '/tmp/reports/production/legacy-urls-production.csv'
              );
              echo json_encode(['ok' => true] + $result, JSON_THROW_ON_ERROR);
          } catch (Throwable $exception) {
              http_response_code(500);
              echo json_encode(['ok' => false, 'error' => $exception->getMessage()], JSON_THROW_ON_ERROR);
          }
          PHP

      - name: Upload migration files
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set cmd:fail-exit true
          set ftp:passive-mode true
          set ftp:ssl-allow false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          mirror --reverse --transfer-all --parallel=4 --no-perms ./.migration/ /
          bye
          LFTP

      - name: Execute and verify migration
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 180 "https://techtires.ru/$MIGRATION_RUNNER_FILE")"
          printf '%s\n' "$response"
          php -r '$r=json_decode($argv[1],true,512,JSON_THROW_ON_ERROR); if(($r["ok"]??false)!==true || ($r["redirects_active"]??0)!==764){exit(1);}' "$response"

      - name: Remove one-time runner
        if: always()
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq lftp
          lftp <<LFTP
          set cmd:fail-exit false
          set ftp:passive-mode true
          set ftp:ssl-allow false
          open -u "$FTP_USERNAME","$FTP_PASSWORD" ftp://grass.gohost.ru:21
          rm "/public/$MIGRATION_RUNNER_FILE"
          rm "/public/__db_migrate_e05fb5dcd67264d68ed4430d.php"
          bye
          LFTP
